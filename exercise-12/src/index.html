<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Exercise</title>
    <!-- Roboto Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- External Stylesheet -->
     <link rel="stylesheet" href="../styles/style.css" >
</head>
<body>
    <header>
        <h1 class="heading">MATH KIDS</h1>
        <h2 class="heading">KIDS LEARNING APP</h2>
    </header>
    <main>
        <!-- Beginning of Shape Selection Section -->
        <section class="shape-selection" id="shape-section">
            <h2 class="shape-selection_heading">1. Choose a Shape</h2>
            <div class="shapes-container">
                <div class="shape circle" data-shape="circle"><div class="tick"></div></div>
                <div class="shape triangle" data-shape="triangle"><div class="tick triangle-tick"></div></div>
                <div class="shape square" data-shape="square"><div class="tick"></div></div>
            </div>
            <button id="next-button" class="button next-button hidden">NEXT</button>
        </section>
        <!-- End of Shape Selection Section -->
         <!-- Beginning of Dimension Section  -->
        <section class="dimension-section" id="dimension-section">
                <h2 class="dimension-heading" >2. Enter <span id="dimension-heading"></span> </h2>
                <input id="dimension-input" class="dimension-input" type="text" >
                <button id="calculate-button" class="button calculate-button">CALCULATE</button>
        </section>
        <!-- End of Dimension Section -->
         <!-- Beginning of Result Section -->
        <section id="result-section" class="result-section">
            <div id="result-shape" ></div>
            <h2 id="result-heading" class="result-heading"></h2>
            <table class="result-content-table">
                <tr class="property-row">
                    <td class="result-property">SIDE</td>
                    <td id="dimension-symbol" class="result-formula">s</td>
                    <td id="dimension-value" class="result-value">5cm</td>
                </tr>
                <tr class="property-row">
                    <td class="result-property">AREA</td>
                    <td id="area-formula" class="result-formula">s * s</td>
                    <td id="area-value" class="result-value">25 sq cm</td>
                </tr>
                <tr class="property-row">
                    <td class="result-property">PERIMETER</td>
                    <td id="perimeter-formula" class="result-formula"></td>
                    <td id="perimeter-value" class="result-value"> cm</td>
                </tr>
            </table>
            <button id="reset-button" class="button repeat-button">START AGAIN</button>
        </section>
        <!-- End of Result Section -->
    </main>
    <script src="../script/script.js"></script>
</body>
</html>
