<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Exercise</title>
    <!-- Roboto Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- External Stylesheet -->
     <link rel="stylesheet" href="style.css" >
</head>
<body>
    <header>
        <h1 class="heading">MATH KIDS</h1>
        <h2 class="heading">KIDS LEARNING APP</h2>
    </header>
    <main>
        <section class="shape-selection">
            <h2 class="shape-selection_heading">1. Choose a Shape</h2>
            <div class="shapes-container">
                <div class="circle-wrapper">
                    <div class="circle"><div class="tick"></div></div>
                </div>
                <div class="triangle-wrapper">
                    <div class="triangle"><div class="tick"></div></div>
                </div>
                <div class="square-wrapper">
                    <div class="square"><div class="tick"></div></div>
                </div>
            </div>
            <button class="next-button">NEXT</button>
        </section>
    </main>
    <script src="asset.js"></script>
</body>
</html>
