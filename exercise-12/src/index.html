<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Exercise</title>
    <!-- Roboto Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- External Stylesheet -->
     <link rel="stylesheet" href="style.css" >
</head>
<body>
    <header>
        <h1 class="heading">MATH KIDS</h1>
        <h2 class="heading">KIDS LEARNING APP</h2>
    </header>
    <main>
        <section class="shape-selection" id="shape-section">
            <h2 class="shape-selection_heading">1. Choose a Shape</h2>
            <div class="shapes-container">
                <div class="circle-wrapper">
                    <div class="shape circle" data-shape="circle"><div class="tick"></div></div>
                </div>
                <div class="triangle-wrapper">
                    <div class="shape triangle" data-shape="triangle"><div class="tick"></div></div>
                </div>
                <div class="square-wrapper">
                    <div class="shape square" data-shape="square"><div class="tick"></div></div>
                </div>
            </div>
            <button id="next-button" class="button next-button">NEXT</button>
        </section>
        <section class="dimension-section" id="dimension-section">
                <h2 class="dimension-heading">2. Enter Side </h2>
                <input class="dimension-input" type="text" >
                <button class="button calculate-button">CALCULATE</button>
        </section>
        <section class="result-section">
            <div class="square"></div>
            <h2 class="result-heading">Square</h2>
            <table class="result-content-table">
                <tr class="property-row">
                    <td class="result-property">SIDE</td>
                    <td class="result-formula">s</td>
                    <td class="result-value">5cm</td>
                </tr>
                <tr class="property-row">
                    <td class="result-property">AREA</td>
                    <td class="result-formula">s * s</td>
                    <td class="result-value">25 sq cm</td>
                </tr>
                <tr class="property-row">
                    <td class="result-property">PERIMETER</td>
                    <td class="result-formula">4 * s</td>
                    <td class="result-value">20 cm</td>
                </tr>
            </table>
            <button class="button repeat-button">START AGAIN</button>
        </section>
    </main>
    <script src="../script/script.js"></script>
</body>
</html>
