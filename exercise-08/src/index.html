<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Hats</title>
    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <main>
        <div class="overlay"></div>
        <!--  Dashboard -->
        <div class="dashboard">
            <i class="fa-solid fa-bars"></i>
            <div class="dashboard-content">
                <img class="dashboard-image" src="../public/hat-icon.svg" alt="Hat" >
                <ul>
                    <li class="dashboard-element"><a>COWBOY HATS</a></li>
                    <li class="dashboard-element"><a>DAD HATS</a></li>
                    <li class="dashboard-element"><a>FEDORAS</a></li>
                    <li class="dashboard-element"><a>TRIBAL HATS</a></li>
                    <li class="dashboard-element"><a>FLAT CAPS</a></li>
                    <li class="dashboard-element"><a>DERBY HATS</a></li>
                    <li class="dashboard-element"><a>ARMY CAPS</a></li>
                    <li class="dashboard-element"><a>CLOCHE HATS</a></li>
                    <li class="dashboard-element"><a>BEANIES</a></li>
                    <li class="dashboard-element"><a>TRAPPER HATS</a></li>
                    <li class="dashboard-element"><a>SNAPBACKS</a></li>
                    <li class="dashboard-element"><a>TRUCKER HATS</a></li>
                    <li class="dashboard-element"><a>VISORS</a></li>
                </ul>
            </div>
        </div>
        <!--Page Content-->
        <h1 class="main-heading">FANCY HATS</h1>
        <p class="sub-heading">SINCE <span class="sub-heading_highlight">1867</span></p>
        <p class="motto-heading">HATS FOR A <br><span class="motto-heading_highlight">LIFETIME</span></p>
        <div class="social-icons">
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-facebook"></i>
        </div>
    </main>
</body>
</html>
