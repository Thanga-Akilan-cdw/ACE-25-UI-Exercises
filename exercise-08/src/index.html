<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Hats</title>
    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css" >
</head>
<body>
    <main>
        <div class="overlay"></div>
        <!--  Dashboard -->
        <div class="dashboard">
            <i class="fa-solid fa-bars"></i>
            <div class="dashboard-content">
                <img class="dashboard-image" src="../public/hat-icon.svg" alt="Hat" >
                <ul>
                    <li class="dashboard-element"><a href="#">COWBOY HATS</a></li>
                    <li class="dashboard-element"><a href="#">DAD HATS</a></li>
                    <li class="dashboard-element"><a href="#">FEDORAS</a></li>
                    <li class="dashboard-element"><a href="#">TRIBAL HATS</a></li>
                    <li class="dashboard-element"><a href="#">FLAT CAPS</a></li>
                    <li class="dashboard-element"><a href="#">DERBY HATS</a></li>
                    <li class="dashboard-element"><a href="#">ARMY CAPS</a></li>
                    <li class="dashboard-element"><a href="#">CLOCHE HATS</a></li>
                    <li class="dashboard-element"><a href="#">BEANIES</a></li>
                    <li class="dashboard-element"><a href="#">TRAPPER HATS</a></li>
                    <li class="dashboard-element"><a href="#">SNAPBACKS</a></li>
                    <li class="dashboard-element"><a href="#">TRUCKER HATS</a></li>
                    <li class="dashboard-element"><a href="#">VISORS</a></li>
                </ul>
            </div>
        </div>
        <!--Page Content-->
        <h1 class="main-heading overlay-text">FANCY HATS</h1>
        <p class="sub-heading overlay-text">SINCE <span class="sub-heading_highlight">1867</span></p>
        <p class="motto-heading overlay-text">HATS FOR A <br><span class="motto-heading_highlight">LIFETIME</span></p>
        <div class="social-icons">
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-facebook"></i>
        </div>
    </main>

</html>
