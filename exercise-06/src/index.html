<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FashionZ</title>
        <!-- Font Awesome Icon -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- Roboto Font Import -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <!-- External Stylesheet -->
        <link rel="stylesheet" href="style.css" >
    </head>
    <body>
        <header>
            <img src="../public/logo.png" alt="FashionZ Logo" width="192px" height="73px" />
            <div class="hamburger">
                <div class="dashboard">
                    <span>My Account</span>
                    <span>My Orders</span>
                    <span>My Wish List</span>
                    <span>Logout</span>
                </div>
            </div>
        </header>
        <main>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-1" src="../public/products/shirt.png" alt="Bath Wardrobe" />
                    <div class="card-type">
                        <span>S</span>
                    </div>
                </div>
                <span class="card-name">Bath Wardrobe</span>
                <span class="card-price">&#8377; 850</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-1" src="../public/products/jacket.png" alt="Winter Jacket" />
                    <div class="card-type">
                        <span>S</span>
                    </div>
                </div>
                <span class="card-name">Winter Jacket</span>
                <span class="card-price">&#8377; 2399</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-2" src="../public/products/tshirt.png" alt="Red Round Neck" />
                    <div class="card-type">
                        <span>M</span>
                    </div>
                </div>
                <span class="card-name">Red Round Neck</span>
                <span class="card-price">&#8377; 350</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-2" src="../public/products/sweatshirt.png" alt="Sweat Shirt" />
                    <div class="card-type">
                        <span>S</span>
                    </div>
                </div>
                <span class="card-name">Sweat Shirt</span>
                <span class="card-price">&#8377; 1350</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-1" src="../public/products/shirt.png" alt="Bath Wardrobe" />
                    <div class="card-type">
                        <span>S</span>

                </div>
                <span class="card-name">Bath Wardrobe</span>
                <span class="card-price">&#8377; 850</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-1" src="../public/products/jacket.png" alt="Winter Jacket" />
                    <div class="card-type">
                        <span>S</span>
                    </div>
                </div>
                <span class="card-name">Winter Jacket</span>
                <span class="card-price">&#8377; 2399</span>
                <button class="card-button">ADD TO CART</button>
            </div>
            <div class="card">
                <div class="card-thumbnail">
                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-2" src="../public/products/tshirt.png" alt="Red Round Neck" />
                    <div class="card-type">
                        <span>M</span>
                    </div>
                </div>
                <span class="card-name">Red Round Neck</span>
                <span class="card-price">&#8377; 350</span>
                <button class="card-button">ADD TO CART</button>

                    <i class="fa-regular fa-star"></i>
                    <img class="card-image__type-2" src="../public/products/sweatshirt.png" alt="Sweat Shirt" />
                    <div class="card-type">
                        <span>S</span>
                    </div>
                </div>
                <span class="card-name">Sweat Shirt</span>
                <span class="card-price">&#8377; 1350</span>
                <button class="card-button">ADD TO CART</button>
            </div>
        </main>
        <footer>
            <ul>
                <li>Jackets</li>
                <li>Shirts</li>
                <li>Trousers</li>
                <li>Pants</li>
                <li>Shoes</li>
            </ul>
        </footer>
    </body>
</html>
